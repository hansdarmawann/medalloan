name: CD

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run release validation
        run: python -m pytest tests -p no:cacheprovider -q

      - name: Build release artifact
        shell: bash
        run: |
          mkdir -p dist/medalloan
          cp -r src scripts migrations notebooks data README.md requirements.txt .env.example pytest.ini dist/medalloan/
          tar -czf "dist/medalloan-${GITHUB_REF_NAME}.tar.gz" -C dist medalloan

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: medalloan-${{ github.ref_name }}
          path: dist/medalloan-${{ github.ref_name }}.tar.gz
