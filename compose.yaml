x-app-environment: &app-environment
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-medalloan}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}
  QUALITY_FAILURE_MODE: ${QUALITY_FAILURE_MODE:-STOP}
  QUALITY_RULE_VERSION: ${QUALITY_RULE_VERSION:-1.0.0}
  PIPELINE_SLA_SECONDS: ${PIPELINE_SLA_SECONDS:-3600}

x-app-service: &app-service
  image: medalloan:local
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-medalloan}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pipeline:
    <<: *app-service
    environment:
      <<: *app-environment
    command: ["python", "scripts/run_pipeline.py", "--source", "/app/data"]

  tests:
    <<: *app-service
    profiles: ["test"]
    environment:
      <<: *app-environment
      DB_NAME: postgres
      RUN_POSTGRES_INTEGRATION: "1"
    command: ["python", "-m", "pytest", "tests", "-p", "no:cacheprovider", "-q"]

volumes:
  postgres_data:
